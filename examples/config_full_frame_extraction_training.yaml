# Full Frame Extraction and Training Configuration
# This config extracts ALL frames from videos, saves them as images with labels,
# and then trains a model on the extracted dataset.

# Video Input Configuration
video_config:
  video_paths:
    - "/Users/yeonwoosung/Desktop/emology_data/converted.mp4"
    - "/Users/yeonwoosung/Desktop/emology_data/a3_first5.mp4"
  batch_size: 16
  frame_skip: 1  # Process EVERY frame (no skip)
  max_frames: null  # Process ALL frames (null = no limit)

# Pseudo Labeling Configuration
pseudo_labeling:
  detector: "retinaface"  # Options: retinaface, mtcnn, faceboxes
  au_model: "xgb"  # Options: svm, xgb, rf
  emotion_model: "resmasknet"  # Options: svm, resmasknet
  confidence_threshold: 0.5  # Lower threshold to keep more samples
  output_dir: "./full_dataset"
  label_format: "json"  # Options: json, csv, parquet
  save_frames: true  # SAVE extracted frames as images
  
  # Frame extraction settings
  frame_extraction:
    save_full_frames: false  # Save only cropped faces (more efficient)
    save_format: "jpg"  # Options: jpg, png
    jpeg_quality: 95  # JPEG quality (1-100)
    organize_by_emotion: true  # Organize frames in emotion-specific folders
    include_metadata: true  # Save frame metadata (bbox, confidence, etc.)

# Training Dataset Configuration
dataset:
  # Use extracted images instead of loading from video
  use_extracted_frames: true  # Load from saved images instead of video
  frames_root_dir: "./full_dataset/frames"  # Directory with extracted frames
  
  min_confidence: 0.6  # Filter labels by confidence
  target_size: [224, 224]  # Image size (width, height)
  split_ratio: [0.7, 0.15, 0.15]  # train, val, test
  
  # Stratified split (ensure balanced classes in splits)
  stratified_split: true
  
  # Data augmentation (for training)
  augmentation:
    enabled: true
    random_flip: true
    random_rotation: 20
    random_crop: true
    color_jitter:
      brightness: 0.3
      contrast: 0.3
      saturation: 0.2
      hue: 0.1
    random_erasing:
      enabled: true
      probability: 0.5

# Model Configuration
model:
  architecture: "resnet18"  # Options: simple_cnn, resnet18, resnet50, efficientnet_b0
  num_classes: 7  # Number of emotion classes
  pretrained: true  # Use ImageNet pretrained weights
  freeze_backbone: false  # Whether to freeze backbone layers
  
  # Emotion classes mapping
  emotion_classes:
    - "anger"
    - "disgust"
    - "fear"
    - "happiness"
    - "sadness"
    - "surprise"
    - "neutral"

# Training Configuration
training:
  epochs: 50  # More epochs for full dataset
  batch_size: 64  # Larger batch for extracted images
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adam"  # Options: adam, sgd, adamw
  
  # Learning rate scheduler
  scheduler:
    type: "cosine"  # Options: step, cosine, reduce_on_plateau
    min_lr: 0.00001
    warmup_epochs: 5
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 10
    monitor: "val_acc"  # or "val_loss"
    mode: "max"  # max for accuracy, min for loss
  
  # Checkpointing
  checkpoint_freq: 5  # Save checkpoint every N epochs
  checkpoint_dir: "./checkpoints/full_dataset"
  save_best_only: true

# Ray Configuration
ray:
  num_workers: 4  # More workers for larger dataset
  num_cpus: 8
  num_gpus: 1  # Use GPU for training
  use_gpu: true

# Output Configuration
output:
  results_dir: "./training_results/full_dataset"
  save_predictions: true
  save_confusion_matrix: true
  save_misclassified_samples: true
  log_frequency: 50  # Log every N batches

# Pipeline Control
pipeline:
  # Control which stages to run
  run_pseudo_labeling: true  # Extract and label all frames
  run_frame_extraction: true  # Save frames as images
  run_training: true  # Train model on extracted dataset
  
  # Cleanup options
  cleanup:
    remove_low_confidence: true  # Remove low confidence samples before training
    remove_duplicates: false  # Remove duplicate frames (based on hash)
    balance_classes: false  # Balance dataset by undersampling majority class
